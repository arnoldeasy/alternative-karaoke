<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternative Karaoke</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎤 Alternative Karaoke</h1>

    <p>Submit your karaoke request below.</p>

    <form id="songForm">

        <label>Your Name</label>
        <input
            type="text"
            id="name"
            placeholder="Your name"
            required
        >

        <label>YouTube Karaoke Link</label>
        <input
            type="url"
            id="youtube"
            placeholder="https://youtube.com/..."
            required
        >

        <button type="submit">
            Add Song
        </button>

    </form>

    <p id="message"></p>

</div>

<!-- Firebase -->
<script type="module" src="firebase.js"></script>

<!-- App -->
<script type="module" src="app.js"></script>

</body>
</html>
